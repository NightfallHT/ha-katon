# Render Blueprint is read from the repo root. If you use the dashboard instead,
# set Root Directory to ai and Dockerfile path to Dockerfile.
services:
  - type: web
    name: hubmi-ai
    runtime: docker
    # Without `plan` Render picks the paid starter tier; without `region` it
    # picks Oregon, and AGENTS.md section 3 wants the data in the EU.
    plan: free
    region: frankfurt
    dockerfilePath: ./ai/Dockerfile
    dockerContext: ./ai
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "1"
      # "*" on purpose: /web calls this service straight from the browser, so a
      # narrower value blocks every Vercel preview URL as well as production.
      # Each preview deploy gets its own hostname.
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIM
        value: "1536"
      # The free instance sleeps; the first call after a wake-up is slow, and 20 s
      # was not enough for it. /web gives up at 75 s.
      - key: LLM_TIMEOUT
        value: "45"
      - key: LLM_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
